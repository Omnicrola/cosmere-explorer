<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmere Explorer</title>
    <style>
      :root {
        --panel-bg: rgb(35,35,35);
        --button-bg: rgb(67,67,67);
        --text-color: white;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      p, ul, li, h1, h2, h3, h4 { margin:0; padding:0; }
      li { list-style-type: none; }
      button {
        background: var(--button-bg);
        color: white;
        border: 1px solid white;
        border-radius: 3px;
        padding: 4px 8px;
      }
      button:hover {cursor: pointer; }

      .panel {
        margin : 10px;
        padding : 10px;
        border-radius: 8px;
        background : var(--panel-bg);
        color: var(--text-color);
        font-family:Arial, Helvetica, sans-serif;

        .panel-select {
          border : none;
          background : var(--panel-bg);
          color: var(--text-color);
          font-size: 1em;

          option {
            background : black;
            cursor: pointer;
          }
        }
      }
      .hidden {
        height:0 !important;
        transition:height 0.25s ease-out;
      }

      .footer {
        position:absolute;
        bottom:0;
        left:0;
        padding:4px;
        font-family: 'Trebuchet MS', Arial, sans-serif;
        font-size: .6em;
        color: rgb(200,200,200);
        
        a {color: rgb(200,200,200);}

        ul {
          display: flex;
          flex-direction: row;
          justify-content: space-around;
          li {
            display: inline-block;
            
          }
          li::before {
            content: "|";
            margin:10px;
          }
          li:first-child::before {
            content:'';
          }

        }
      }

      #navbar {
        position: absolute;
        top: 5px;
        width: 100%;
        display: flex;
        justify-content: space-between;

        .panel-button {
          display:inline-block;
          margin: 2px 10px;
          font-size:1.2em;
        }
        
        .panel-select {
          width:200px;
          margin: 2px 10px;
          font-size: 1.2em;
        }
        
      }

      #info-panel {
        position: absolute;
        top: 80px;
        right: 0;
        width: 450px;
        overflow: hidden;
        transition: top 0.5s ease;
        transition-delay: 0.5s;

        &.hidden {
          top:2000px;
          transition: top 0.5s ease;
        }
        .planet-icon {
          float: right;
          margin-left: 10px;
          overflow: hidden;
          border-radius: 4px;
          width:64px;
          color:white;
          background:black;
        }
        .name { margin-bottom: 10px; }
        .description { margin-bottom: 10px; }
        .stats {
          li {
            margin:6px 4px;
          }
          a { color: white; }
          a:hover{color: rgb(0,255,0); }
          a:visited{color: white; }
        }
        button.close {
          position:absolute;
          top:10px;
          right:10px;
        }
        .btn-copy-link {
          margin:0;
          padding:0;
          border:0;
          background:transparent;
        }
        .copy-link {
          width:24px;
        }
      }
      .btn-no-style {
        border:none;
        background:transparent;
      }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script type="importmap">
      {
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/",
          "camera-controls": "https://cdn.jsdelivr.net/npm/camera-controls@3.1.2/dist/camera-controls.module.min.js"
        }
			}
  </script>
  </head>
  <body>
    <div id="navbar">
      <div class="panel">
          <label>Current System : </label>
          <select id="system-selector" class="panel-select">
            <option value="1">Stellar System Name</option>
          </select>
      </div>
      <div class="panel">
        <button class="btn-no-style" id="btn-system-info">
          <h1 id="system-name">System Name</h1>
        </button>
      </div>
      <div class="panel">
        <button id="previous-planet" class="panel-button" title="Go to the previous planet in the list">&lt; Previous</button>
        <select id="planet-select" class="panel-select">
          <option value="1">Planet 1</option>
        </select>
        <button id="next-planet" class="panel-button" title="Go to the next planet in the list">&gt; Next</button>
      </div>
    </div>
    
    <!-- contents are rendered by src/ui/infoPanels.js -->
    <div id="info-panel" class="panel hidden"></div>
    <div id="render-container"></div>
    <div class="footer">
      <ul>
        <li>Cosmere and related works are &copy; Brandon Sanderson</li>
        <li><a target="_blank" rel="noopener noreferrer" href="https://discord.gg/8kGurXw4vU">Discord</a></li>
        <li><a target="_blank" rel="noopener noreferrer" href="https://github.com/Omnicrola/cosmere-explorer">Github</a></li>
        <li>v1.14 - last updated December 30 2025</li>
      </ul>
    </div>
  <script type="module">
      import { init } from "./src/mainScene.js";

      init();
    </script>
  </body>
</html>
