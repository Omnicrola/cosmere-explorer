<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmere Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script type="importmap">
      {
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/",
          "camera-controls": "https://cdn.jsdelivr.net/npm/camera-controls@3.1.2/dist/camera-controls.module.min.js"
        }
			}
  </script>
  </head>
  <body>
    <div id="navbar">
      <div class="panel">
          <label>Current System : </label>
          <select id="system-selector" class="panel-select">
            <option value="1">Stellar System Name</option>
          </select>
      </div>
      <div class="panel">
        <button class="btn-no-style" id="btn-system-info">
          <h1 id="system-name">System Name</h1>
        </button>
      </div>
      <div class="panel">
        <button id="previous-planet" class="panel-button" title="Go to the previous planet in the list">&lt; Previous</button>
        <select id="planet-select" class="panel-select">
          <option value="1">Planet 1</option>
        </select>
        <button id="next-planet" class="panel-button" title="Go to the next planet in the list">&gt; Next</button>
      </div>
    </div>
    
    <!-- contents are rendered by src/ui/infoPanels.js -->
    <div id="info-panel" class="panel hidden"></div>
    <div id="render-container"></div>
    <div class="footer">
      <ul>
        <li>Cosmere and related works are &copy; Brandon Sanderson</li>
        <li><a target="_blank" rel="noopener noreferrer" href="https://discord.gg/8kGurXw4vU">Discord</a></li>
        <li><a target="_blank" rel="noopener noreferrer" href="https://github.com/Omnicrola/cosmere-explorer">Github</a></li>
        <li>v1.14 - last updated December 30 2025</li>
      </ul>
    </div>
  <script type="module">
      import { init } from "./src/mainScene.js";

      init();
    </script>
  </body>
</html>
