<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Fresnel Sphere</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">Fresnel Shader Spheres - Orbiting Light</div>
    <div id="container"></div>
    
    <div id="controls" style="position: absolute; top: 10px; right: 10px; color: white; font-family: Arial, sans-serif; font-size: 12px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 5px;">
        <h4 style="margin: 0 0 10px 0;">Inner Sphere (Normal Fresnel)</h4>
        <label>Power: <span id="power1-value">2.0</span></label><br>
        <input type="range" id="power1" min="0.5" max="5.0" step="0.1" value="2.0" style="width: 150px;"><br><br>
        
        <label>Intensity: <span id="intensity1-value">1.2</span></label><br>
        <input type="range" id="intensity1" min="0.1" max="3.0" step="0.1" value="1.2" style="width: 150px;"><br><br>
        
        <label>Light Intensity: <span id="light1-value">1.0</span></label><br>
        <input type="range" id="light1" min="0.0" max="2.0" step="0.1" value="1.0" style="width: 150px;"><br><br>
        
        <h4 style="margin: 15px 0 10px 0;">Outer Sphere (Inverted Fresnel)</h4>
        <label>Size: <span id="size2-value">2.0</span></label><br>
        <input type="range" id="size2" min="0.1" max="5.0" step="0.01" value="2.0" style="width: 150px;"><br><br>

        <label>Power: <span id="power2-value">2.0</span></label><br>
        <input type="range" id="power2" min="0.5" max="20.0" step="0.1" value="2.0" style="width: 150px;"><br><br>
        
        <label>Intensity: <span id="intensity2-value">1.2</span></label><br>
        <input type="range" id="intensity2" min="0.1" max="20.0" step="0.1" value="1.2" style="width: 150px;"><br><br>
        
        <label>Light Intensity: <span id="light2-value">1.0</span></label><br>
        <input type="range" id="light2" min="0.0" max="20.0" step="0.1" value="1.0" style="width: 150px;"><br><br>
        
        <label>Transparency Radius: <span id="radius2-value">0.0</span></label><br>
        <input type="range" id="radius2" min="0.0" max="3.0" step="0.01" value="0.0" style="width: 150px;"><br><br>
        
        <label>
            <input type="checkbox" id="sideToogle" checked> Back Side Rendering
        </label>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0a0a);
        document.getElementById('container').appendChild(renderer.domElement);

        // Fresnel shader material (normal)
        const fresnelShader = {
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 color1;
                uniform vec3 color2;
                uniform float fresnelBias;
                uniform float fresnelScale;
                uniform float fresnelPower;
                uniform float lightIntensity;
                uniform vec3 lightPosition;
                
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                
                void main() {
                    vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
                    vec3 lightDirection = normalize(lightPosition - vWorldPosition);
                    
                    // Fresnel calculation
                    float fresnel = fresnelBias + fresnelScale * pow(1.0 - dot(viewDirection, vNormal), fresnelPower);
                    
                    // Simple lighting with controllable intensity
                    float lighting = max(0.0, dot(vNormal, lightDirection));
                    lighting = mix(1.0, lighting * 0.5 + 0.5, lightIntensity); // Blend between full brightness and lighting
                    
                    // Mix colors based on fresnel
                    vec3 finalColor = mix(color1, color2, fresnel);
                    finalColor *= lighting;
                    
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        };

        // Inverted Fresnel shader material
        const invertedFresnelShader = {
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                varying vec4 vScreenPosition;
                
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    
                    // Calculate screen position
                    vScreenPosition = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    
                    gl_Position = vScreenPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 constantColor;
                uniform float fresnelBias;
                uniform float fresnelScale;
                uniform float fresnelPower;
                uniform float lightIntensity;
                uniform float transparencyRadius;
                uniform vec3 lightPosition;
                uniform vec2 resolution;
                uniform vec4 sphereCenterScreen;
                
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                varying vec4 vScreenPosition;
                
                void main() {
                    vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
                    vec3 lightDirection = normalize(lightPosition - vWorldPosition); // Inverted light direction
                    
                    // Convert to normalized device coordinates
                    vec2 screenPos = (vScreenPosition.xy / vScreenPosition.w) * 0.5 + 0.5;
                    vec2 sphereCenter = (sphereCenterScreen.xy / sphereCenterScreen.w) * 0.5 + 0.5;
                    
                    // Calculate screen-space distance from sphere center
                    vec2 screenDiff = (screenPos - sphereCenter) * resolution;
                    float screenDistance = length(screenDiff);
                    
                    // Inverted Fresnel calculation for alpha
                    float fresnelAlpha =      fresnelBias + fresnelScale * pow(1.0 - dot(viewDirection, vNormal), fresnelPower);
                    //float fresnelAlpha = fresnelBias + fresnelScale * pow(dot(viewDirection, vNormal), fresnelPower);
                    fresnelAlpha = clamp(fresnelAlpha, 0.0, 1.0);
                    
                    // Apply transparency radius based on screen distance
                    float radiusInPixels = transparencyRadius * 100.0; // Convert slider to pixel radius
                    float radiusAlpha = smoothstep(radiusInPixels - 20.0, radiusInPixels + 20.0, screenDistance);
                    
                    // Combine fresnel alpha with radius alpha
                    float finalAlpha = fresnelAlpha * radiusAlpha;
                    
                    // Simple lighting for the constant color with inverted light direction and controllable intensity
                    float lighting = max(0.0, dot(vNormal, lightDirection));
                    lighting = mix(1.0, lighting * 0.5 + 0.5, lightIntensity); // Blend between full brightness and lighting
                    
                    // Use constant color with combined alpha
                    vec3 finalColor = constantColor * lighting;
                    
                    gl_FragColor = vec4(constantColor, finalAlpha);
                }
            `
        };

        // Create sphere geometries
        const geometry1 = new THREE.SphereGeometry(2, 64, 32);
        const geometry2 = new THREE.SphereGeometry(2.1, 64, 32); // Slightly larger
        
        // Create shader materials
        const material1 = new THREE.ShaderMaterial({
            uniforms: {
                color1: { value: new THREE.Color(0x1a1a2e) }, // Dark blue core
                color2: { value: new THREE.Color(0x16537e) }, // Bright blue rim
                fresnelBias: { value: 0.1 },
                fresnelScale: { value: 1.2 },
                fresnelPower: { value: 2.0 },
                lightIntensity: { value: 1.0 },
                lightPosition: { value: new THREE.Vector3(5, 5, 5) }
            },
            vertexShader: fresnelShader.vertexShader,
            fragmentShader: fresnelShader.fragmentShader
        });

        const material2 = new THREE.ShaderMaterial({
            uniforms: {
                constantColor: { value: new THREE.Color(0xff4444) }, // Constant red color
                fresnelBias: { value: 0.1 },
                fresnelScale: { value: 1.2 },
                fresnelPower: { value: 2.0 },
                lightIntensity: { value: 1.0 },
                transparencyRadius: { value: 0.0 },
                lightPosition: { value: new THREE.Vector3(5, 5, 5) },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                sphereCenterScreen: { value: new THREE.Vector4(0, 0, 0, 1) }
            },
            vertexShader: invertedFresnelShader.vertexShader,
            fragmentShader: invertedFresnelShader.fragmentShader,
            transparent: true,
            side: THREE.BackSide
        });

        // Create sphere meshes
        const sphere1 = new THREE.Mesh(geometry1, material1); // Inner sphere
        const sphere2 = new THREE.Mesh(geometry2, material2); // Outer sphere
        scene.add(sphere1);
        scene.add(sphere2);

        // Add point light
        const pointLight = new THREE.PointLight(0xffffff, 1, 100);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // Add ambient light for better visibility
        const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
        scene.add(ambientLight);

        // Position camera
        camera.position.set(0, 0, 6);

        // Light orbit variables
        let lightAngle = 0;
        const lightRadius = 8;

        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Update resolution uniform
            material2.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', onWindowResize);

        // Control setup
        const power1Slider = document.getElementById('power1');
        const power1Value = document.getElementById('power1-value');
        const intensity1Slider = document.getElementById('intensity1');
        const intensity1Value = document.getElementById('intensity1-value');
        const light1Slider = document.getElementById('light1');
        const light1Value = document.getElementById('light1-value');
        
        const size2Slider = document.getElementById('size2');
        const size2Value = document.getElementById('size2-value');
        const power2Slider = document.getElementById('power2');
        const power2Value = document.getElementById('power2-value');
        const intensity2Slider = document.getElementById('intensity2');
        const intensity2Value = document.getElementById('intensity2-value');
        const light2Slider = document.getElementById('light2');
        const light2Value = document.getElementById('light2-value');
        const radius2Slider = document.getElementById('radius2');
        const radius2Value = document.getElementById('radius2-value');
        const sideToggle = document.getElementById('sideToogle');

        // Inner sphere controls
        power1Slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            material1.uniforms.fresnelPower.value = value;
            power1Value.textContent = value.toFixed(1);
        });

        intensity1Slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            material1.uniforms.fresnelScale.value = value;
            intensity1Value.textContent = value.toFixed(1);
        });

        light1Slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            material1.uniforms.lightIntensity.value = value;
            light1Value.textContent = value.toFixed(1);
        });

        // Outer sphere controls
        power2Slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            material2.uniforms.fresnelPower.value = value;
            power2Value.textContent = value.toFixed(1);
        });

        size2Slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            sphere2.scale.setScalar(value);
            size2Value.textContent = value.toFixed(1);
        });

        power2Slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            material2.uniforms.fresnelPower.value = value;
            power2Value.textContent = value.toFixed(1);
        });

        intensity2Slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            material2.uniforms.fresnelScale.value = value;
            intensity2Value.textContent = value.toFixed(1);
        });

        light2Slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            material2.uniforms.lightIntensity.value = value;
            light2Value.textContent = value.toFixed(1);
        });

        radius2Slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            material2.uniforms.transparencyRadius.value = value;
            radius2Value.textContent = value.toFixed(1);
        });

        // Side toggle control
        sideToggle.addEventListener('change', (e) => {
            material2.side = e.target.checked ? THREE.BackSide : THREE.FrontSide;
            material2.needsUpdate = true;
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Orbit the light around the spheres
            lightAngle += 0.02;
            pointLight.position.x = Math.cos(lightAngle) * lightRadius;
            pointLight.position.z = Math.sin(lightAngle) * lightRadius;
            pointLight.position.y = Math.sin(lightAngle * 0.5) * 3; // Add vertical movement

            // Calculate sphere center in screen space for shader
            const sphereCenterWorld = new THREE.Vector3(0, 0, 0);
            const sphereCenterScreen = sphereCenterWorld.clone().project(camera);
            material2.uniforms.sphereCenterScreen.value.set(
                sphereCenterScreen.x, 
                sphereCenterScreen.y, 
                sphereCenterScreen.z, 
                1.0
            );

            // Rotate the spheres slowly
            sphere1.rotation.y += 0.005;
            sphere1.rotation.x += 0.002;
            sphere2.rotation.y -= 0.003; // Counter-rotate for visual interest
            sphere2.rotation.x -= 0.001;

            // Update light position in shaders
            material1.uniforms.lightPosition.value.copy(pointLight.position);
            material2.uniforms.lightPosition.value.copy(pointLight.position);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
