<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary Icon Generator</title>
      <script type="importmap">
      {
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
			}
  </script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: row;
        }
        
        .panel {
            margin: 10px;
            padding: 10px;
            border: 1px solid lightgray;
            border-radius: 10px;
        }

        .column-left {
            flex:2;
        }
        .column-right {
            flex:1;
        }

        button {
            text-align: center;
            padding:5px;
            border: 1px solid lightgray;
            border-radius: 5px;
        }

        #icon-select-container {
            display:flex;
            flex-direction: column;
        }

        .stellar-item {
            margin:2px;
            padding:2px;
        }

        .divider { margin: 10px 0px;}
    </style>
</head>
<body>
    <h1>🌍 Planet Icon Generator</h1>
    <div class="container">
        <div class="column">
            <div class="panel">
                <h2>Select Stellar System</h2>
                <select id="system-select">
                    <option value="-1">-- Select --</option>
                </select>
            </div>
            <div id="message"></div>
        </div>
        <div class="column">
            <div class="panel">
                <h3>Select Icons to Generate</h3>
                <button id="save-icons">💾 Save Icons</button>
                <hr class="divider"/>
                <button id="select-all">✅ All</button>
                <button id="clear-all">⏹️ Clear</button>
                <hr class="divider"/>
                <div id="icon-select-container">
                </div>
            </div>
        </div>
        <div class="column">
            <div class="panel">
                <div id="canvas-container"></div>
            </div>
        </div>
        
    </div>

    <script type="module">
        import * as THREE from 'three';
        import {createPlanetMaterial, createAtmosphericShader } from '../resources/materials.js';
        import { allStellarSystems } from '../src/data/all-systems.js';
        import { STELLAR_OBJECT } from '../src/data/stellarData.js';

        let scene, camera, renderer, light;
        let currentPlanet = null;
        let currentStellarMap = [];
        
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(30, 1, 0.1, 1000);
            camera.position.set(0, 0, 4.5);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                preserveDrawingBuffer: true 
            });
            renderer.setSize(400, 400);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Create point light positioned to the right
            light = new THREE.PointLight(0xffffff, 20, 0, 1.0);
            light.position.set(10,1,10);
            light.castShadow = true;
            light.shadow.mapSize.width = 2048;
            light.shadow.mapSize.height = 2048;
            scene.add(light);
            
            // Add ambient light for better visibility
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.05);
            scene.add(ambientLight);
            
            // Create initial sphere
            createPlanetForIcon(allStellarSystems[0].stellarObjects[0]);
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                
                camera.lookAt(scene.position);
                
                renderer.render(scene, camera);
            }
            
            animate();
        }
        
        const basic_1U_sphere = new THREE.IcosahedronGeometry(1, 12)
        function createPlanetForIcon(planetData) {
            // Remove existing sphere
            if (currentPlanet) {
                scene.remove(currentPlanet);
            }

            const planetMaterial = createPlanetMaterial(planetData, '../resources/textures/');
            currentPlanet = new THREE.Mesh(basic_1U_sphere, planetMaterial);
            currentPlanet.castShadow = true;
            currentPlanet.receiveShadow = true;

            // ignore the atmosphere if it's a moon
            if(planetData.stellarObjectType === STELLAR_OBJECT.PLANET) {
                const atmosphere = new THREE.Mesh(basic_1U_sphere, createAtmosphericShader(planetData));
                atmosphere.scale.setScalar(1.05);
                currentPlanet.add(atmosphere);
            }
            
            scene.add(currentPlanet);
        }
        
         async function saveOneIcon(planetData) {                   

                createPlanetForIcon(planetData);
                
                // wait 100ms for the textures to fully load
                return new Promise((resolve) => {
                    setTimeout(() => {
                        console.log('snapshot : '+ planetData.id)
                        // Render one frame 
                        renderer.render(scene, camera);
                        
                        // // Get the image data
                        const canvas = renderer.domElement;
                        const link = document.createElement('a');
                        link.download = `icon-${planetData.id}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();

                        resolve();
                    }, 500);
                });
        }

        async function saveSelectedIcons() {
            const messageDiv = document.getElementById('message');
            
            try {
                // Store current size
                const originalWidth = renderer.domElement.width;
                const originalHeight = renderer.domElement.height;
                
                // Temporarily set size to 128x128
                renderer.setSize(128, 128);
                
                // actually save the icon
                const dataList = getAllCheckboxes()
                .filter(c => c.checked)
                .map(toStellarData);

                for(let i=0; i<dataList.length; i++) {
                    await saveOneIcon(dataList[i]);
                }

                // Restore original size
                renderer.setSize(400, 400);
                
                messageDiv.innerHTML = '<div class="success">💾 Image saved successfully as 128x128 PNG!</div>';
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 3000);
                
            } catch (error) {
                messageDiv.innerHTML = `<div class="error">❌ Error saving image: ${error.message}</div>`;
                
                // Restore size even if there's an error
                renderer.setSize(400, 400);
            }
        }
        
        function createPlanetCheckbox(itemData) {

            const newPair = document.createElement('span');
            newPair.classList.add('stellar-item');
            newPair.innerHTML = `
                <input type="checkbox" class="stellar-option" name="stellarObjects" value="${itemData.id}" />
                <label>${itemData.name}</label>
            `;
            return newPair;
        }

        function populateStellarObjectCheckboxes(systemData) {
            const iconSelect = document.getElementById('icon-select-container');
            iconSelect.innerHTML = '';

            currentStellarMap = systemData.stellarObjects
            .flatMap(obj=>[obj].concat(obj.children||[]))
            .filter(obj => {
                return obj.stellarObjectType === STELLAR_OBJECT.PLANET || obj.stellarObjectType === STELLAR_OBJECT.MOON;
            });

            currentStellarMap.forEach(stellarObj => {
                iconSelect.appendChild(createPlanetCheckbox(stellarObj));
            });

            getAllCheckboxes().forEach(c => {
                c.addEventListener('change', (e) => {
                   createPlanetForIcon(currentStellarMap.find(d=>d.id == e.target.value));
                });
            });

        }

        // find the designated item
        function toStellarData(checkbox) {
            return currentStellarMap.find(data=>checkbox.value==data.id);
        }

        /////////////////////////////////////////////////
        // Initialize the app
        init();

        const systemSelect = document.getElementById('system-select');
        allStellarSystems.forEach(systemData => {
            const newOption = document.createElement('option');
            newOption.value = systemData.key;
            newOption.innerText = systemData.name;
            systemSelect.appendChild(newOption);
        });

        systemSelect.addEventListener('change', (e) => {
            const selectedKey = e.target.value;
            const selectedSystem = allStellarSystems.find(s => s.key == selectedKey);
            populateStellarObjectCheckboxes(selectedSystem);
        });

        function getAllCheckboxes() {
            const checkboxes = document.getElementsByClassName('stellar-option')
            return Array.from(checkboxes);
        }

        document.getElementById('select-all').addEventListener('click', ()=> {
            getAllCheckboxes().forEach(e=> e.checked=true);
        });


        document.getElementById('clear-all').addEventListener('click', ()=> {
            getAllCheckboxes().forEach(e=> e.checked=false);
        });

        document.getElementById('save-icons').addEventListener('click', () => {
            saveSelectedIcons();
        });

    </script>
</body>
</html>
